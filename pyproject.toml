[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-app-tested"
version = "0.6.0"
description = "Laboratory work 6 (Professional Python): automated testing of the student records system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
test = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23"]

[project.scripts]
student-report = "student_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg-info", "build", "dist", "experiments", "report", "results", "data", "htmlcov"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: декілька компонентів разом, реальні файли в tmp_path",
    "asyncio: async-тести (pytest-asyncio)",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["student_app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT"]
